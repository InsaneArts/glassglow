name: GlassGlowDemo
options:
  bundleIdPrefix: dev.insanearts.glassglow
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES
    INFOPLIST_KEY_CFBundleDisplayName: GlassGlow
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    INFOPLIST_KEY_NSHumanReadableCopyright: "GlassGlow demo"

packages:
  GlassGlow:
    path: ..

targets:
  GlassGlowDemo:
    type: application
    platform: macOS
    sources:
      - path: GlassGlowDemo
    dependencies:
      - package: GlassGlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.insanearts.glassglow.demo
        PRODUCT_NAME: GlassGlowDemo
    scheme: {}
